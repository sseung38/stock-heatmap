spring.application.name=stock-heatmap-local
spring.profiles.active=local
server.port=8787

# Load API keys from the git-ignored .env file in the repo root (KEY=value lines are valid
# .properties syntax; [.properties] tells Spring how to parse a file with this extension).
spring.config.import=optional:file:.env[.properties]

# Where refresh jobs write JSON and the watchlist is kept (relative to the repo root).
heatmap.data-dir=.data
# Optional: serve this file as /config.json instead of the local default (used by dev:remote).
heatmap.config-file=
